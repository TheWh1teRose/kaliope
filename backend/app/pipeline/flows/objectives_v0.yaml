id: objectives_v0
version: "1.0"
description: >-
  Listener objectives drive selection and outline. After the script is written,
  an AI critic and a human pause collect notes; apply_notes then revises the
  script one note at a time.
nodes:
  - node: ingest
  - node: content_budget
    config: {min_compression: 2.5}
  - node: objectives
    config: {model: claude-opus-5}
  - node: objective_select
    config: {model: claude-opus-5}
  - node: objective_outline
    config: {model: claude-opus-5}
  - node: script
    config: {model: claude-opus-5, temperature: 0.7}
  - node: ai_critic
    config: {model: claude-opus-5}
  - node: human_feedback
  - node: apply_notes
    config: {model: claude-opus-5}
gates: [G0, G1, G2, G3, G4, G5, G6, G7, G8]
