id: baseline_v0
version: "1.0"
description: >-
  Control condition. No quality mechanisms: no best-of-N, no revision loops, no
  critique passes. Every later flow is compared against this one.
nodes:
  - node: ingest
  - node: content_budget
    config: {min_compression: 2.5}
  - node: select
    config: {model: claude-opus-5}
  - node: outline
    config: {model: claude-opus-5}
  - node: script
    config: {model: claude-opus-5, temperature: 0.7}
gates: [G0, G1, G2, G3, G4, G5, G6, G7, G8]
